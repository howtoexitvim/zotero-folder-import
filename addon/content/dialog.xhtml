<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://folder-import/content/dialog.css" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    xmlns:html="http://www.w3.org/1999/xhtml"
    id="folder-import-dialog"
    title="Folder Import"
    width="1000"
    height="760"
    onload="FolderImportDialog.init()"
>
  <script src="chrome://global/content/customElements.js" />
  <script src="chrome://folder-import/content/dialog.js" />

  <!--
    Content is plain XUL. Mixing HTML elements into the window body made the
    parser drop the entire subtree (documentElement ended up with children=0),
    so this follows the structure of working plugins: vbox/hbox/label/button,
    with richbox only where scrolling is needed.
  -->
  <vbox id="folder-import-root" flex="1">
    <vbox id="scroll-area" flex="1">
      <vbox id="preview-view" flex="1">
        <label id="preview-title" class="heading" value="Review import" />

        <!--
          Each path gets its own full-width row and crops in the middle, so a
          long path ellipsizes instead of stretching the window. The full text
          is on the tooltip.
        -->
        <vbox class="paths">
          <hbox class="path-row" align="center">
            <label id="lbl-source" class="path-label" value="Source" />
            <label id="source-path" class="path-value" crop="center" flex="1" />
          </hbox>
          <hbox class="path-row" align="center">
            <label id="lbl-destination" class="path-label" value="Destination" />
            <label id="destination-path" class="path-value" crop="center" flex="1" />
          </hbox>
        </vbox>

        <hbox class="metrics" align="center">
          <vbox class="metric"><label id="count-total" class="num" value="0" /><label id="lbl-files" value="files" /></vbox>
          <vbox class="metric"><label id="count-size" class="num" value="0 B" /><label id="lbl-size" value="total size" /></vbox>
          <vbox class="metric"><label id="count-new" class="num" value="0" /><label id="lbl-new" value="new" /></vbox>
          <vbox class="metric"><label id="count-reused" class="num" value="0" /><label id="lbl-reused" value="already in library" /></vbox>
          <vbox class="metric"><label id="count-conflicts" class="num" value="0" /><label id="lbl-conflicts" value="conflicts" /></vbox>
          <vbox class="metric"><label id="count-unsupported" class="num" value="0" /><label id="lbl-unsupported" value="unsupported" /></vbox>
          <vbox class="metric"><label id="count-errors" class="num" value="0" /><label id="lbl-errors" value="errors" /></vbox>
        </hbox>

        <vbox class="group">
          <label id="lbl-collections" class="group-title" value="Collections to create" />
          <vbox id="collection-list" class="list" />
        </vbox>

        <vbox id="scan-error-group" class="group" hidden="true">
          <label id="lbl-scan-errors" class="group-title" value="Files unavailable during scanning" />
          <vbox id="scan-error-list" class="list errors" />
        </vbox>

        <!--
          Conflict controls only appear when there actually are conflicts.
          No data-l10n-id anywhere in this file: the plugin's Fluent bundle does
          not resolve here, and DOM localization then blanks a checkbox's label
          and concatenates unresolved ids into the text layer.
        -->
        <vbox id="conflict-toolbar" class="group" hidden="true">
          <label id="conflict-hint" class="group-title" />
          <checkbox id="apply-all" />
        </vbox>

        <hbox class="thead">
          <label id="head-file" class="col-file" value="File" />
          <label id="head-size" class="col-size" value="Size" />
          <label id="head-status" class="col-status" value="Status" />
          <label id="head-action" class="col-action" value="Action" hidden="true" />
        </hbox>
        <vbox id="file-table-scroll" class="table" flex="1" style="overflow: auto;">
          <vbox id="file-table-body" />
        </vbox>
      </vbox>

      <vbox id="progress-view" flex="1" hidden="true">
        <label id="progress-title" class="heading" value="Importing…" />
        <html:progress id="progress-meter" value="0" max="1" />
        <label id="progress-label" crop="center" />
        <label id="result-summary" />
        <vbox id="result-errors" class="list errors" />
      </vbox>
    </vbox>

    <hbox id="footer" pack="end" align="center">
      <button id="cancel-button" label="Cancel" />
      <button id="import-button" default="true" label="Import" />
      <button id="close-button" hidden="true" label="Close" />
    </hbox>
  </vbox>
</window>
