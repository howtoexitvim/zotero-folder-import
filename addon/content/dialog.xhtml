<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://folder-import/content/dialog.css" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    xmlns:html="http://www.w3.org/1999/xhtml"
    id="folder-import-dialog"
    title="Folder Import"
    width="1000"
    height="760"
    onload="FolderImportDialog.init()"
>
  <linkset>
    <html:link rel="localization" href="folder-import.ftl" />
  </linkset>
  <script src="chrome://global/content/customElements.js" />
  <script src="chrome://folder-import/content/dialog.js" />

  <!--
    Content is plain XUL. Mixing HTML elements into the window body made the
    parser drop the entire subtree (documentElement ended up with children=0),
    so this follows the structure of working plugins: vbox/hbox/label/button,
    with richbox only where scrolling is needed.
  -->
  <vbox id="folder-import-root" flex="1">
    <vbox id="scroll-area" flex="1">
      <vbox id="preview-view" flex="1">
        <label id="preview-title" class="heading" data-l10n-id="folder-import-preview-title" value="Review import" />
        <label id="preview-subtitle" class="subtitle" data-l10n-id="folder-import-preview-description" value="Nothing is written until you confirm." />

        <!--
          Each path gets its own full-width row and crops in the middle, so a
          long path ellipsizes instead of stretching the window. The full text
          is on the tooltip.
        -->
        <vbox class="paths">
          <hbox class="path-row" align="center">
            <label class="path-label" data-l10n-id="folder-import-source" value="Source" />
            <label id="source-path" class="path-value" crop="center" flex="1" />
          </hbox>
          <hbox class="path-row" align="center">
            <label class="path-label" data-l10n-id="folder-import-destination" value="Destination" />
            <label id="destination-path" class="path-value" crop="center" flex="1" />
          </hbox>
        </vbox>

        <hbox class="metrics" align="center">
          <vbox class="metric"><label id="count-total" class="num" value="0" /><label data-l10n-id="folder-import-files" value="files" /></vbox>
          <vbox class="metric"><label id="count-size" class="num" value="0 B" /><label data-l10n-id="folder-import-total-size" value="total size" /></vbox>
          <vbox class="metric"><label id="count-new" class="num" value="0" /><label data-l10n-id="folder-import-new" value="new" /></vbox>
          <vbox class="metric"><label id="count-reused" class="num" value="0" /><label data-l10n-id="folder-import-reused" value="reused" /></vbox>
          <vbox class="metric"><label id="count-conflicts" class="num" value="0" /><label data-l10n-id="folder-import-conflicts" value="conflicts" /></vbox>
          <vbox class="metric"><label id="count-unsupported" class="num" value="0" /><label data-l10n-id="folder-import-unsupported" value="unsupported" /></vbox>
          <vbox class="metric"><label id="count-errors" class="num" value="0" /><label data-l10n-id="folder-import-errors" value="errors" /></vbox>
        </hbox>

        <vbox class="group">
          <label class="group-title" data-l10n-id="folder-import-collections-to-create" value="Collections to create" />
          <vbox id="collection-list" class="list" />
        </vbox>

        <vbox id="scan-error-group" class="group" hidden="true">
          <label class="group-title" data-l10n-id="folder-import-scan-errors" value="Files unavailable during scanning" />
          <vbox id="scan-error-list" class="list errors" />
        </vbox>

        <hbox class="conflict-toolbar" align="center">
          <!--
            No data-l10n-id here: DOM localization clears a checkbox's built-in
            label before the plugin bundle resolves, leaving an unlabelled box.
            The label is set from script instead, like the menu item.
          -->
          <checkbox id="apply-all" label="Apply this choice to all remaining conflicts" />
        </hbox>

        <hbox class="thead">
          <label class="col-file" data-l10n-id="folder-import-file" value="File" />
          <label class="col-type" data-l10n-id="folder-import-type" value="Type" />
          <label class="col-size" data-l10n-id="folder-import-size" value="Size" />
          <label class="col-status" data-l10n-id="folder-import-status" value="Status" />
          <label class="col-action" data-l10n-id="folder-import-action" value="Action" />
        </hbox>
        <vbox id="file-table-scroll" class="table" flex="1" style="overflow: auto;">
          <vbox id="file-table-body" />
        </vbox>
      </vbox>

      <vbox id="progress-view" flex="1" hidden="true">
        <label id="progress-title" class="heading" data-l10n-id="folder-import-importing" value="Importing…" />
        <html:progress id="progress-meter" value="0" max="1" />
        <label id="progress-label" crop="center" />
        <label id="result-summary" />
        <vbox id="result-errors" class="list errors" />
      </vbox>
    </vbox>

    <hbox id="footer" pack="end" align="center">
      <button id="cancel-button" data-l10n-id="folder-import-cancel" label="Cancel" />
      <button id="import-button" default="true" data-l10n-id="folder-import-confirm" label="Import" />
      <button id="close-button" hidden="true" data-l10n-id="folder-import-close" label="Close" />
    </hbox>
  </vbox>
</window>
