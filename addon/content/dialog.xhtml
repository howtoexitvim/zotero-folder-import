<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<?xml-stylesheet href="chrome://folder-import/content/dialog.css" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    xmlns:html="http://www.w3.org/1999/xhtml"
    id="folder-import-dialog"
    data-l10n-id="folder-import-dialog-title"
    width="1000"
    height="760"
    onload="FolderImportDialog.init()"
>
  <linkset>
    <html:link rel="localization" href="folder-import.ftl" />
  </linkset>
  <!--
    Zotero's own dialogs load their page script with loadSubScript into the
    window scope rather than <script src=>, which is what makes the resulting
    globals visible to the onload attribute.
  -->
  <script>
    Services.scriptloader.loadSubScript("chrome://folder-import/content/dialog.js", this);
  </script>

  <!--
    Zotero's own dialogs only ever use html:div, html:span, html:input,
    html:label, html:h1, html:p, html:a, html:progress and html:textarea
    inside XUL. Sectioning and table tags (main/section/header/footer/details/
    table/dl/ul/select) are never used and are not built by the XUL parser, so
    anything nested inside them is silently dropped from the DOM. Everything
    below sticks to the proven tag set; the file table is built from divs.
  -->
  <vbox id="folder-import-root" flex="1">
    <html:div id="scroll-area">
      <html:div id="preview-view">
        <html:h1 data-l10n-id="folder-import-preview-title">Review import</html:h1>
        <html:p class="subtitle" data-l10n-id="folder-import-preview-description">Nothing is written until you confirm.</html:p>

        <html:div class="paths">
          <html:span class="label" data-l10n-id="folder-import-source">Source</html:span>
          <html:span id="source-path" class="value"></html:span>
          <html:span class="label" data-l10n-id="folder-import-destination">Destination</html:span>
          <html:span id="destination-path" class="value"></html:span>
        </html:div>

        <html:div class="metrics">
          <html:div class="metric"><html:span id="count-total" class="num">0</html:span><html:span data-l10n-id="folder-import-files">files</html:span></html:div>
          <html:div class="metric"><html:span id="count-size" class="num">0 B</html:span><html:span data-l10n-id="folder-import-total-size">total size</html:span></html:div>
          <html:div class="metric"><html:span id="count-new" class="num">0</html:span><html:span data-l10n-id="folder-import-new">new</html:span></html:div>
          <html:div class="metric"><html:span id="count-reused" class="num">0</html:span><html:span data-l10n-id="folder-import-reused">reused</html:span></html:div>
          <html:div class="metric"><html:span id="count-conflicts" class="num">0</html:span><html:span data-l10n-id="folder-import-conflicts">conflicts</html:span></html:div>
          <html:div class="metric"><html:span id="count-unsupported" class="num">0</html:span><html:span data-l10n-id="folder-import-unsupported">unsupported</html:span></html:div>
          <html:div class="metric"><html:span id="count-errors" class="num">0</html:span><html:span data-l10n-id="folder-import-errors">errors</html:span></html:div>
        </html:div>

        <html:div class="group">
          <html:span class="group-title" data-l10n-id="folder-import-collections-to-create">Collections to create</html:span>
          <html:div id="collection-list" class="list"></html:div>
        </html:div>

        <html:div id="scan-error-group" class="group" hidden="hidden">
          <html:span class="group-title" data-l10n-id="folder-import-scan-errors">Files unavailable during scanning</html:span>
          <html:div id="scan-error-list" class="list errors"></html:div>
        </html:div>

        <html:div class="conflict-toolbar">
          <html:label><html:input id="apply-all" type="checkbox" /><html:span data-l10n-id="folder-import-apply-all">Apply this choice to all remaining conflicts</html:span></html:label>
        </html:div>

        <html:div class="table">
          <html:div class="thead">
            <html:span data-l10n-id="folder-import-file">File</html:span>
            <html:span data-l10n-id="folder-import-type">Type</html:span>
            <html:span data-l10n-id="folder-import-size">Size</html:span>
            <html:span data-l10n-id="folder-import-status">Status</html:span>
            <html:span data-l10n-id="folder-import-action">Action</html:span>
          </html:div>
          <html:div id="file-table-body" class="tbody"></html:div>
        </html:div>
      </html:div>

      <html:div id="progress-view" hidden="hidden">
        <html:h1 id="progress-title" data-l10n-id="folder-import-importing">Importing…</html:h1>
        <html:progress id="progress-meter" value="0" max="1"></html:progress>
        <html:p id="progress-label"></html:p>
        <html:p id="result-summary"></html:p>
        <html:div id="result-errors" class="list errors"></html:div>
      </html:div>
    </html:div>

    <!-- XUL buttons fire "command", not "click". -->
    <hbox id="footer" pack="end" align="center">
      <button id="cancel-button" data-l10n-id="folder-import-cancel" label="Cancel" />
      <button id="import-button" default="true" data-l10n-id="folder-import-confirm" label="Import" />
      <button id="close-button" hidden="true" data-l10n-id="folder-import-close" label="Close" />
    </hbox>
  </vbox>
</window>
